[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sniffdog"
version = "0.1.0"
description = "Read-only checks for suspicious coding assignments"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
memory = ["pymongo"]
tracing = ["sentry-sdk"]

[project.scripts]
sniffdog = "sniffdog.cli:main"

[tool.setuptools.packages.find]
include = ["sniffdog*"]
